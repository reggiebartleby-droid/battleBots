<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BattleBots — prototype</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: system-ui, sans-serif; color: #eee; }
    #c { width: 100%; height: 100%; display: block; outline: none; }
    /* v0.19 HUD: compact cards; V cycles top strip / bottom corners / left strip */
    #hud { position: absolute; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
    .board { background: rgba(14,16,20,.62); border: 1px solid rgba(120,130,145,.35); border-radius: 6px; padding: 5px 9px 6px; width: 230px; box-sizing: border-box; }
    .board h3 { margin: 0 0 3px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meter { display: grid; grid-template-columns: 40px 1fr 30px; gap: 6px; font-size: 10px; align-items: center; line-height: 14px; color: #b9c2cc; letter-spacing: .06em; }
    .meter span:last-child, .part span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .meter.flash { background: rgba(255,60,60,.35); border-radius: 3px; }
    .nums { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: .06em; color: #b9c2cc; margin-top: 2px; white-space: nowrap; }
    .nums b { color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }
    .nums .bonus { color: #ffd166; font-weight: 800; margin-left: 5px; }
    .details { margin-top: 4px; padding-top: 4px; border-top: 1px solid #333; }
    .part { display: grid; grid-template-columns: 92px 1fr 30px; gap: 6px; font-size: 10px; align-items: center; line-height: 14px; }
    .part span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar { height: 6px; background: #2a2d33; border-radius: 3px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #2ecc71; }
    .bar i.ar { background: #6fb7ff; }
    .bar i.mid { background: #f1c40f; } .bar i.low { background: #e74c3c; } .bar i.dead { background: #555; }
    #timer { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; background: rgba(14,16,20,.7); border: 2px solid #c9a227; border-radius: 50%; width: 52px; height: 52px; flex: none; display: flex; align-items: center; justify-content: center; }
    /* 1: top strip (under the help line / arena pickers) */
    body.hud-top #hud { top: 58px; left: 12px; right: 12px; }
    body.hud-top #board2 h3 { text-align: right; }
    body.hud-top #finish { top: max(24%, 145px); }
    body.hud-top #sign { top: max(34%, 205px); }
    body.hud-top #controls { top: auto; bottom: 16px; }
    /* 2: bottom corners */
    body.hud-bottom #hud { bottom: 10px; left: 12px; right: 12px; align-items: flex-end; }
    /* 3: left strip */
    body.hud-left #hud { top: 58px; left: 12px; flex-direction: column; align-items: center; justify-content: flex-start; width: 230px; }
    #finish { position: absolute; top: 14%; left: 0; right: 0; text-align: center; font-size: 56px; font-weight: 900; color: #ff1a1a; text-shadow: 0 0 18px #f00; display: none; letter-spacing: .06em; }
    #finish.on { display: block; animation: blink .45s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #winner { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: 48px; font-weight: 900; display: none; text-shadow: 0 0 14px #000; }
    #sign { position: absolute; top: 22%; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 900; letter-spacing: .12em; display: none; text-shadow: 0 0 14px #000; pointer-events: none; }
    #sign.on { display: block; }
    body.inlab #sign { display: none; }
    #help { position: absolute; top: 10px; left: 12px; font-size: 12px; opacity: .7; }
    /* weapon status + hit stats rows in the scoreboards */
    .part.flash { background: rgba(255,60,60,.45); border-radius: 4px; }
    .part.wpn .bar i.w { background: #3ee6c4; box-shadow: 0 0 6px #3ee6c4; }
    .part.wpn.off .bar i.w { background: #556; box-shadow: none; }
    .part.wpn.hit .bar i.w { background: #fff; box-shadow: 0 0 10px #fff; }
    .part.wpn.dead .bar i.w { background: #555; }
    .part.wpn { grid-template-columns: 50px 1fr auto; }
    .part.wpn .lbl { font-size: 9px; white-space: nowrap; letter-spacing: .04em; }
    .part.wpn.on .lbl, .part.wpn.hit .lbl { color: #3ee6c4; }
    .part.wpn.dead .lbl { color: #e45a5a; }
    .part.stats { grid-template-columns: 1fr 1fr 1fr; opacity: .85; margin-top: 2px; }
    /* floating hit labels */
    #fxlayer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .fxlabel { position: absolute; left: 0; top: 0; font-weight: 900; font-size: 28px; text-shadow: 0 0 6px #000, 0 0 12px #000; will-change: transform, opacity; }
    .fxlabel.bump { font-size: 15px; font-weight: 600; opacity: .8; }
    /* controls card shown at match start */
    #controls { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); background: rgba(20,22,26,.9); border: 2px solid #4a4f58; border-radius: 8px; padding: 10px 16px; font-size: 13px; line-height: 1.6; display: none; max-width: 720px; text-align: center; pointer-events: none; }
    #controls.on { display: block; }
    #controls b { color: #f2b134; }
    body.inlab #hud, body.inlab #help, body.inlab #finish, body.inlab #winner, body.inlab #controls, body.inlab #fxlayer, body.inlab #arenaui { display: none; }
    /* v0.18 in-match arena picker */
    #arenaui { position: absolute; top: 10px; right: 12px; display: flex; gap: 10px; font-size: 11px; letter-spacing: .1em; color: #8fa3ad; }
    #arenaui label { display: flex; flex-direction: column; gap: 3px; }
    #arenaui select { font: inherit; font-size: 12px; letter-spacing: 0; background: rgba(11,16,19,.85); color: #d7e3e6; border: 1px solid #33424c; border-radius: 3px; padding: 4px 6px; }

    /* ---- Lab / bot builder (Option A: 3D lab scene + HTML instrument panels) ---- */
    #lab { position: absolute; inset: 0; display: none; pointer-events: none; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; color: #d7e3e6; }
    #lab.on { display: block; }
    #lab .inst { position: absolute; pointer-events: auto; background: #141b20; border: 2px solid #2a363f; border-radius: 6px; box-shadow: 0 0 0 1px #0a0e11, 0 20px 50px rgba(0,0,0,.6); display: flex; flex-direction: column; overflow: hidden; }
    #lab .inst h3 { margin: 0; padding: 10px 14px; border-bottom: 2px solid #2a363f; background: #1a2228; font: 700 13px/1 system-ui, sans-serif; letter-spacing: .14em; color: #8fa3ad; display: flex; justify-content: space-between; align-items: center; }
    #lab .led { width: 10px; height: 10px; border-radius: 50%; background: #3ee6c4; box-shadow: 0 0 8px #3ee6c4; }
    #lab .inst .pad { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
    #rack { left: 24px; top: 24px; bottom: 24px; width: 330px; }
    #bin { right: 24px; top: 24px; width: 300px; max-height: calc(100% - 300px); }
    #tele { right: 24px; bottom: 24px; width: 300px; }
    #deploybar { position: absolute; left: 380px; right: 350px; bottom: 24px; display: flex; align-items: center; gap: 12px; pointer-events: auto; flex-wrap: wrap; }
    #lab .fld { display: flex; flex-direction: column; gap: 4px; font-size: 11px; letter-spacing: .1em; color: #8fa3ad; }
    #lab select, #lab input[type=text] { font: inherit; font-size: 13px; background: #0b1013; color: #d7e3e6; border: 1px solid #33424c; border-radius: 3px; padding: 8px 10px; }
    #lab input[type=color] { width: 36px; height: 34px; border: 1px solid #33424c; background: #0b1013; padding: 0; border-radius: 3px; cursor: pointer; }
    #bb-desc { font-size: 11px; color: #6f8089; min-height: 14px; }
    .rack-row, .bin-item { font: inherit; text-align: left; cursor: pointer; background: #0b1013; color: #d7e3e6; border: 1px solid #33424c; border-radius: 3px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; row-gap: 2px; }
    .rack-row:hover, .bin-item:hover { border-color: #5a6f7c; }
    .rack-row.sel { border-color: #f2b134; background: #1d1f1a; }
    .rack-row.empty .pn { color: #6f8089; }
    .rack-row .lbl { grid-column: 1 / 3; font-size: 10px; letter-spacing: .12em; color: #8fa3ad; }
    .rack-row.sel .lbl { color: #f2b134; }
    .rack-row .pn, .bin-item .pn { font-size: 13px; }
    .rack-row .ps, .bin-item .ps { grid-column: 1 / 3; font-size: 11px; color: #8fa3ad; }
    .bin-item.sel { border-color: #3ee6c4; background: #1d2b2a; }
    .bin-item .pw { font-size: 12px; color: #8fa3ad; }
    .bin-item.sel .pw { color: #3ee6c4; }
    .scope { background: #06110f; border: 1px solid #1e3a34; border-radius: 3px; padding: 8px 10px; box-shadow: inset 0 0 24px #0a2a24; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
    .scope .kv { display: flex; justify-content: space-between; }
    .scope .kv b { color: #3ee6c4; font-weight: 600; }
    .scope .mbar { height: 8px; background: #0f1d1a; border-radius: 4px; overflow: hidden; }
    .scope .mbar i { display: block; height: 100%; background: #3ee6c4; box-shadow: 0 0 8px #3ee6c4; transition: width .15s; }
    .scope .mbar i.tight { background: #f2b134; box-shadow: 0 0 8px #f2b134; }
    .scope .mbar i.over { background: #e45a5a; box-shadow: 0 0 8px #e45a5a; }
    #bb-status { font-size: 11px; letter-spacing: .08em; }
    #bb-status.ok { color: #3ee6c4; } #bb-status.bad { color: #e45a5a; }
    #bb-errors { margin: 0; padding-left: 16px; font-size: 11px; color: #ff8a8a; }
    #bb-deploy { font: 700 18px/1 system-ui, sans-serif; letter-spacing: .14em; background: #f2b134; color: #141b20; border: 0; border-radius: 4px; padding: 14px 28px; cursor: pointer; margin-left: auto; }
    #bb-deploy:disabled { background: #333; color: #777; cursor: not-allowed; }

    /* ---- v0.23 test course ---- */
    #bb-course { font: 700 14px/1 system-ui, sans-serif; letter-spacing: .12em; background: #0b1013; color: #3ee6c4; border: 2px solid #3ee6c4; border-radius: 4px; padding: 12px 18px; cursor: pointer; }
    #bb-course:disabled { color: #555; border-color: #333; cursor: not-allowed; }
    #bb-deploy { margin-left: 0; }
    #cmenu, #cresults { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #141b20; border: 2px solid #2a363f; border-radius: 6px; box-shadow: 0 0 0 1px #0a0e11, 0 20px 50px rgba(0,0,0,.6); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; color: #d7e3e6; display: none; width: min(620px, calc(100% - 32px)); }
    #cmenu.on, #cresults.on { display: block; }
    #cmenu h3, #cresults h3 { margin: 0; padding: 10px 14px; border-bottom: 2px solid #2a363f; background: #1a2228; font: 700 13px/1 system-ui, sans-serif; letter-spacing: .14em; color: #8fa3ad; }
    #cmenu .pad, #cresults .pad { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    #cmenu .fld { display: flex; flex-direction: column; gap: 4px; font-size: 11px; letter-spacing: .1em; color: #8fa3ad; }
    #cmenu select { font: inherit; font-size: 13px; background: #0b1013; color: #d7e3e6; border: 1px solid #33424c; border-radius: 3px; padding: 8px 10px; }
    #cm-stations { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #cm-stations button { font: inherit; text-align: left; cursor: pointer; background: #0b1013; color: #d7e3e6; border: 1px solid #33424c; border-radius: 3px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
    #cm-stations button:hover { border-color: #f2b134; }
    #cm-stations b { font-size: 13px; color: #f2b134; letter-spacing: .08em; }
    #cm-stations span { font-size: 11px; color: #8fa3ad; }
    #cmenu .rec { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: .08em; color: #ff6b6b; }
    #cmenu .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    #cmenu .back, #cresults button { font: inherit; font-size: 12px; background: #0b1013; color: #8fa3ad; border: 1px solid #33424c; border-radius: 3px; padding: 8px 12px; cursor: pointer; }
    #cresults table { border-collapse: collapse; font-size: 13px; width: 100%; }
    #cresults td { padding: 4px 6px; border-bottom: 1px solid #222c33; }
    #cresults td:last-child { text-align: right; color: #3ee6c4; font-variant-numeric: tabular-nums; }
    #cresults .saved { font-size: 12px; color: #3ee6c4; } #cresults .saved.bad { color: #ff8a8a; }
    #cresults .keys { font-size: 11px; color: #8fa3ad; }
    #chud { position: absolute; top: 40px; left: 12px; background: rgba(14,16,20,.7); border: 1px solid rgba(120,130,145,.35); border-radius: 6px; padding: 8px 12px; font-size: 13px; line-height: 1.6; display: none; pointer-events: none; min-width: 240px; }
    #chud h4 { margin: 0 0 2px; font-size: 12px; letter-spacing: .12em; color: #f2b134; }
    #chud .tag { font-size: 10px; letter-spacing: .1em; padding: 1px 6px; border-radius: 3px; margin-left: 6px; }
    #chud .tag.rec { background: #c0392b; color: #fff; } #chud .tag.prac { background: #33424c; color: #cfd8dc; }
    body.incourse #chud { display: block; }
    body.incourse #hud, body.incourse #arenaui, body.incourse #controls, body.incourse #finish, body.incourse #winner { display: none; }
    body.incourse.inmenu #chud, body.incourse.inmenu #help { display: none; }
  </style>
</head>
<body>
  <canvas id="c" tabindex="0"></canvas>
  <div id="fxlayer"></div>
  <div id="help">P1: WASD + SPACE | P2: AI (T toggles) | R: restart | B: lab</div>
  <div id="controls"></div>
  <div id="arenaui">
    <label>ARENA COLOUR <select id="ar-colour"></select></label>
    <label>FLOOR GRID <select id="ar-grid"></select></label>
  </div>
  <div id="sign"></div>

  <div id="lab">
    <div class="inst" id="rack">
      <h3>ASSEMBLY RACK <span class="led"></span></h3>
      <div class="pad">
        <label class="fld">CHASSIS <select id="bb-body"></select></label>
        <div id="bb-desc"></div>
        <label class="fld">PRESET <select id="bb-presets"></select></label>
        <div id="bb-rack" style="display:flex;flex-direction:column;gap:6px"></div>
      </div>
    </div>

    <div class="inst" id="bin">
      <h3 id="bb-bin-title">PARTS BIN</h3>
      <div class="pad" id="bb-bin"></div>
    </div>

    <div class="inst" id="tele">
      <h3>TELEMETRY</h3>
      <div class="pad">
        <div class="scope">
          <div class="kv"><span>MASS</span><b id="bb-mass">0 / 0</b></div>
          <div class="mbar"><i id="bb-mass-bar"></i></div>
          <div class="kv"><span>HP TOTAL</span><b id="bb-hp">0</b></div>
          <div class="kv"><span>ARMOR</span><b id="bb-armor">0</b></div>
          <div class="kv"><span>SPEED</span><b id="bb-speed">0</b></div>
        </div>
        <div id="bb-status" class="ok">✓ BUILD VALID</div>
        <ul id="bb-errors"></ul>
      </div>
    </div>

    <div id="deploybar">
      <label class="fld">CALLSIGN <input id="bb-name" type="text" maxlength="16"></label>
      <label class="fld">PAINT <input id="bb-paint" type="color"></label>
      <label class="fld">OPPONENT (AI) <select id="bb-opponent"></select></label>
      <label class="fld">AI LEVEL <select id="bb-difficulty"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select></label>
      <label class="fld" title="Off: weapon and weapon motor stop at 1 HP and keep working">BREAKABLE WEAPONS <input id="bb-breakable" type="checkbox"></label>
      <span id="bb-shellaids" style="display:none;gap:12px"><label class="fld" title="Shell spinners: still cap on a post through the shell bearing, with an arrow pointing at the nose">NOSE CAP <input id="bb-cap" type="checkbox"></label>
      <label class="fld" title="Shell spinners: glowing arrow on the floor ahead of the nose (game aid)">FLOOR ARROW <input id="bb-arrow" type="checkbox"></label></span>
      <label class="fld" title="v0.27 art theme. Cube Bots: every part is built from cubes and hits knock them loose (looks only: physics and HP unchanged). Both bots.">LOOK <select id="bb-look"><option value="worn">Battle-worn</option><option value="cubes">Cube Bots</option></select></label>
      <span id="bb-cubeopts" style="display:none;gap:12px"><label class="fld">CUBE STYLE <select id="bb-cubestyle"><option value="glow">Pixel Glow</option><option value="block">Toy Block</option><option value="energy">Energy Cube</option></select></label>
      <label class="fld" title="Smaller cubes = more detail, but more cubes to draw (frame rate)">CUBE SIZE <select id="bb-cubesize"><option value="big">8-bit (big)</option><option value="mid">16-bit</option><option value="small">Hi-res (small)</option></select></label></span>
      <label class="fld" title="TEMPORARY test: multiplies both bots' drive power (pushing force, acceleration, turning). x1 = normal.">DRIVE BOOST (TEST) <span><input id="bb-boost" type="range" min="1" max="3" step="0.25" value="1"> <b id="bb-boost-val">x1</b></span></label>
      <span style="margin-left:auto;display:flex;gap:10px"><button id="bb-wtest" type="button" title="See the weapon move on the turntable. Spinners: press = ON/OFF. Hammer: tap = swing, hold = stay down. Flipper: press = fire. Lifter / grappler / crusher: hold.">TEST WEAPON (SPACE)</button>
      <button id="bb-course" type="button" title="Test course: drive one station at a time, timed">TEST COURSE ▶</button>
      <button id="bb-deploy" type="button">DEPLOY ▶</button></span>
    </div>
  </div>
  <div id="chud"></div>
  <div id="cmenu">
    <h3>TEST COURSE</h3>
    <div class="pad">
      <label class="fld">BOT <select id="cm-bot"></select></label>
      <div id="cm-stations"></div>
      <div class="row">
        <label class="rec"><input id="cm-rec" type="checkbox"> RECORDED RUN <span style="color:#8fa3ad;font-size:11px">(saved to runs\runs.csv + results screen)</span></label>
        <button class="back" id="cm-lab" type="button">◀ LAB</button>
      </div>
    </div>
  </div>
  <div id="cresults">
    <h3 id="cr-title">RESULTS</h3>
    <div class="pad">
      <table id="cr-table"></table>
      <div class="saved" id="cr-saved"></div>
      <div class="keys">R run again · C stations · B lab</div>
    </div>
  </div>
  <div id="finish">FINISH HIM!</div>
  <div id="winner"></div>
  <div id="hud">
    <div class="board" id="board1"></div>
    <div id="timer">3:00</div>
    <div class="board" id="board2"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
